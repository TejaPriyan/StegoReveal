<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04070B" />
      <stop offset="60%" stop-color="#08101A" />
      <stop offset="100%" stop-color="#04070B" />
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#00FF88" />
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#04070B" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <circle cx="600" cy="315" r="450" fill="url(#centerGlow)" />
  <rect x="20" y="20" width="1160" height="590" rx="24" stroke="#00F0FF" stroke-width="1.5" stroke-opacity="0.25" />

  <!-- Shield Logo -->
  <g transform="translate(140, 195) scale(2.8)">
    <path d="M32 10 L48 18 V31 C48 42 41 50 32 54 C23 50 16 42 16 31 V18 Z" 
          stroke="url(#neonGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="#0B121C" fill-opacity="0.8" />
    <circle cx="32" cy="31" r="5" fill="#00FF88" />
    <circle cx="32" cy="31" r="9" stroke="#00F0FF" stroke-width="1.8" stroke-dasharray="3 2" />
  </g>

  <!-- Title & Typography -->
  <text x="350" y="240" font-family="'Inter', system-ui, sans-serif" font-size="64" font-weight="900" fill="#FFFFFF" letter-spacing="1">STEGO<tspan fill="#00F0FF">REVEAL</tspan></text>
  <rect x="850" y="195" width="210" height="34" rx="8" fill="#00F0FF" fill-opacity="0.12" stroke="#00F0FF" stroke-opacity="0.4" />
  <text x="955" y="217" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#00F0FF" text-anchor="middle">RECEIVER TERMINAL</text>

  <text x="350" y="300" font-family="'Inter', system-ui, sans-serif" font-size="28" font-weight="700" fill="url(#neonGrad)">Zero-Knowledge Steganography Message Extractor &amp; AES-256 Decryptor</text>
  <text x="350" y="360" font-family="'Inter', system-ui, sans-serif" font-size="20" fill="#94A3B8">Upload any carrier image to reveal secret text or binary files instantly.</text>
  <text x="350" y="395" font-family="'Inter', system-ui, sans-serif" font-size="20" fill="#94A3B8">Auto-detects 1-LSB Lossless &amp; Social-Safe 8x8 DCT Armor. 100% Client-Side.</text>

  <!-- Badges footer -->
  <g transform="translate(350, 450)">
    <rect x="0" y="0" width="160" height="42" rx="10" fill="#0B121C" stroke="#00F0FF" stroke-opacity="0.3" />
    <text x="80" y="26" font-family="'JetBrains Mono', monospace" font-size="14" fill="#00F0FF" font-weight="600" text-anchor="middle">1-LSB Engine</text>

    <rect x="180" y="0" width="195" height="42" rx="10" fill="#0B121C" stroke="#00FF88" stroke-opacity="0.3" />
    <text x="277" y="26" font-family="'JetBrains Mono', monospace" font-size="14" fill="#00FF88" font-weight="600" text-anchor="middle">8x8 DCT Armor</text>

    <rect x="395" y="0" width="170" height="42" rx="10" fill="#0B121C" stroke="#F59E0B" stroke-opacity="0.3" />
    <text x="480" y="26" font-family="'JetBrains Mono', monospace" font-size="14" fill="#F59E0B" font-weight="600" text-anchor="middle">AES-256-GCM</text>

    <rect x="585" y="0" width="150" height="42" rx="10" fill="#0B121C" stroke="#A855F7" stroke-opacity="0.3" />
    <text x="660" y="26" font-family="'JetBrains Mono', monospace" font-size="14" fill="#C084FC" font-weight="600" text-anchor="middle">CRC32 Verified</text>
  </g>
</svg>

