<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="stegoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#00FF88" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="#04070B" />
  <rect x="1" y="1" width="62" height="62" rx="13" stroke="url(#stegoGrad)" stroke-width="1.5" stroke-opacity="0.4" />
  
  <!-- Outer Shield / Carrier Frame -->
  <path d="M32 10 L48 18 V31 C48 42 41 50 32 54 C23 50 16 42 16 31 V18 Z" 
        stroke="url(#stegoGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="#0B121C" fill-opacity="0.7" filter="url(#glow)"/>
  
  <!-- Steganography Eye / Sensor -->
  <circle cx="32" cy="31" r="5" fill="#00FF88" />
  <circle cx="32" cy="31" r="9" stroke="#00F0FF" stroke-width="1.8" stroke-dasharray="3 2" />
  
  <!-- Data bits accent -->
  <circle cx="24" cy="22" r="1.5" fill="#00F0FF" opacity="0.8" />
  <circle cx="40" cy="22" r="1.5" fill="#00FF88" opacity="0.8" />
  <circle cx="32" cy="44" r="1.5" fill="#00F0FF" opacity="0.8" />
</svg>
